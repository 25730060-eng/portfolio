<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>데드라인 아비스: 인어의 역습</title>
<style>
:root{
  --cyan:#35f3ff;
  --cyan-soft:#8ef9ff;
  --magenta:#ff4fd8;
  --purple:#8a7dff;
  --red:#ff365f;
  --green:#89ffca;
  --text:#eafcff;
  --muted:#8da8b8;
  --warning:#ff4c6a;
  --panel-h: 36vh;
  --panel-h-min: 200px;
  --panel-h-max: 300px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;
  overflow:hidden;
  font-family:"Consolas","Pretendard","Noto Sans KR",monospace;
  background:#020409;
  color:var(--text);
}

/* ━━━━━━━━━━━━━━━━━━━━
   STAGE — 풀스크린
━━━━━━━━━━━━━━━━━━━━ */
.stage{
  position:fixed;
  inset:0;
  overflow:hidden;
}

/* 배경 이미지 — 1920×1080 대응 */
.bg-img{
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  object-fit:cover;
  opacity:0;
  transition:opacity .5s ease;
  z-index:0;
}
/* 이미지 없을 때 CSS 폴백 배경 */
.bg-fallback{
  position:absolute;
  inset:0;
  z-index:0;
  transition:background .5s ease;
}

/* 그라데이션 오버레이: 이미지 위에 분위기 강화 */
.bg-overlay{
  position:absolute;
  inset:0;
  z-index:1;
  pointer-events:none;
  /* 하단으로 갈수록 어둡게 — 패널 가독성 확보 */
  background:linear-gradient(
    to bottom,
    rgba(0,0,0,.08) 0%,
    rgba(0,0,0,.12) 40%,
    rgba(0,0,0,.55) 65%,
    rgba(2,4,14,.88) 100%
  );
  transition:background .5s ease;
}
/* 씬별 컬러 틴트 */
.scene-abyss   .bg-overlay{ background:linear-gradient(to bottom,rgba(0,20,30,.15) 0%,rgba(0,0,0,.1) 40%,rgba(0,5,20,.6) 65%,rgba(2,5,18,.92) 100%); }
.scene-upper   .bg-overlay{ background:linear-gradient(to bottom,rgba(5,15,25,.1) 0%,rgba(0,0,0,.08) 40%,rgba(2,8,18,.55) 65%,rgba(3,6,14,.9) 100%); }
.scene-market  .bg-overlay{ background:linear-gradient(to bottom,rgba(20,5,25,.2) 0%,rgba(10,0,15,.15) 40%,rgba(12,3,20,.6) 65%,rgba(8,2,15,.92) 100%); }
.scene-threat  .bg-overlay{ background:linear-gradient(to bottom,rgba(30,0,5,.2) 0%,rgba(15,0,5,.15) 40%,rgba(20,2,8,.65) 65%,rgba(10,2,5,.94) 100%); }
.scene-glitch  .bg-overlay{ background:linear-gradient(to bottom,rgba(18,2,22,.2) 0%,rgba(10,0,15,.15) 40%,rgba(15,2,20,.62) 65%,rgba(8,2,14,.92) 100%); }
.scene-judgment.bg-overlay{ background:linear-gradient(to bottom,rgba(5,10,20,.12) 0%,rgba(3,6,15,.1) 40%,rgba(4,8,18,.58) 65%,rgba(3,5,15,.92) 100%); }

/* 스캔라인 텍스처 */
.scanlines{
  position:absolute;
  inset:0;
  z-index:2;
  pointer-events:none;
  background:repeating-linear-gradient(
    to bottom,
    rgba(255,255,255,.025) 0 1px,
    transparent 1px 4px
  );
  opacity:.5;
  mix-blend-mode:screen;
}
/* 수직 데이터 스트림 */
.data-grid{
  position:absolute;
  inset:0;
  z-index:2;
  pointer-events:none;
  background:repeating-linear-gradient(
    90deg,
    rgba(53,243,255,.02) 0 1px,
    transparent 1px 80px
  );
  animation:dataFlash 3.2s steps(2,end) infinite;
}
@keyframes dataFlash{
  72%{opacity:1}73%{opacity:.3;transform:translateX(-4px)}74%{opacity:1;transform:none}
}

/* 씬 전환 워터 드리프트 */
.water-drift{
  position:absolute;
  inset:0;
  z-index:2;
  pointer-events:none;
  background:repeating-linear-gradient(
    175deg,
    rgba(53,243,255,.04) 0 1px,
    transparent 1px 28px
  );
  animation:waterDrift 10s linear infinite;
  opacity:.6;
}
@keyframes waterDrift{to{transform:translateY(28px)}}

/* 위험 경고 적색 펄스 */
.red-alert{
  position:absolute;
  inset:0;
  z-index:3;
  pointer-events:none;
  background:radial-gradient(ellipse at 75% 20%,rgba(255,54,95,.35),transparent 30%);
  animation:redPulse 1.1s ease-in-out infinite;
  display:none;
}
.scene-threat .red-alert{display:block}
@keyframes redPulse{50%{opacity:.2}}

/* ━━━━━━━━━━━━━━━━━━━━
   캐릭터
━━━━━━━━━━━━━━━━━━━━ */
.character{
  position:absolute;
  /* 패널 위 중앙에 서있는 느낌 */
  bottom:var(--panel-h);
  left:50%;
  transform:translateX(-50%);
  width:clamp(180px,20vw,320px);
  height:clamp(240px,40vh,520px);
  z-index:4;
  filter:drop-shadow(0 0 32px rgba(53,243,255,.3));
  transition:filter .4s ease, opacity .4s ease, bottom .4s ease;
  display:flex;
  align-items:flex-end;
  justify-content:center;
}
.character svg{width:100%;height:100%;overflow:visible}
@keyframes charEnter{
  from{opacity:0;transform:translateX(-50%) translateY(24px)}
  to  {opacity:1;transform:translateX(-50%) translateY(0)}
}
.character.entering{animation:charEnter .5s cubic-bezier(.22,.61,.36,1) both}

/* ━━━━━━━━━━━━━━━━━━━━
   HEADER — 씬 이름 좌상단
━━━━━━━━━━━━━━━━━━━━ */
.hud-top{
  position:absolute;
  top:0;left:0;right:0;
  z-index:10;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  padding:18px 24px;
  pointer-events:none;
}
.stage-label{
  padding:8px 14px;
  border-left:3px solid var(--cyan);
  color:var(--cyan);
  background:rgba(2,6,14,.55);
  backdrop-filter:blur(6px);
  font-weight:900;
  font-size:clamp(.75rem,.9vw,.92rem);
  letter-spacing:.04em;
  text-shadow:0 0 14px rgba(53,243,255,.5);
  max-width:50vw;
  line-height:1.3;
}
.title-block{
  text-align:right;
}
.game-title{
  font-size:clamp(1rem,1.4vw,1.5rem);
  font-weight:900;
  letter-spacing:.06em;
  text-shadow:0 0 18px rgba(53,243,255,.55);
  color:var(--text);
  line-height:1.1;
}
.game-sub{
  font-size:.78rem;
  color:var(--muted);
  margin-top:2px;
}

/* ━━━━━━━━━━━━━━━━━━━━
   하단 오버레이 패널
━━━━━━━━━━━━━━━━━━━━ */
.bottom-panel{
  position:absolute;
  bottom:0;left:0;right:0;
  height:clamp(var(--panel-h-min), var(--panel-h), var(--panel-h-max));
  z-index:10;
  display:grid;
  grid-template-columns:1fr auto;
  grid-template-rows:1fr auto;
  column-gap:0;
  background:rgba(2,5,14,.78);
  border-top:1px solid rgba(53,243,255,.22);
  backdrop-filter:blur(18px) saturate(1.3);
  box-shadow:0 -24px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(53,243,255,.1);
  transition:height .4s ease;
}
/* 패널 상단 얇은 글로우 라인 */
.bottom-panel::before{
  content:'';
  position:absolute;
  top:-1px;left:0;right:0;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(53,243,255,.6),var(--magenta),rgba(53,243,255,.6),transparent);
  pointer-events:none;
}

/* 대화 영역 */
.dialogue{
  grid-column:1/2;
  grid-row:1/2;
  padding:12px 18px 10px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  border-right:1px solid rgba(53,243,255,.1);
  min-width:0;
}
.speaker-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:6px;
}
.name{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:5px 14px;
  color:#021015;
  background:linear-gradient(90deg,var(--cyan),var(--cyan-soft));
  border-radius:999px;
  font-weight:900;
  font-size:.88rem;
  letter-spacing:.02em;
  flex-shrink:0;
}
.scene-desc{
  font-size:.75rem;
  color:var(--muted);
  opacity:.7;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.text{
  font-size:clamp(.82rem,.95vw,.96rem);
  line-height:1.65;
  color:var(--text);
  overflow-wrap:break-word;
  word-break:keep-all;
}
.cursor{animation:blink .7s infinite}
@keyframes blink{50%{opacity:0}}

/* 선택지 영역 */
.choices{
  grid-column:2/3;
  grid-row:1/2;
  padding:12px 16px 10px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:10px;
  width:clamp(240px,38vw,440px);
}
.choice{
  position:relative;
  padding:16px 20px;
  cursor:pointer;
  color:var(--text);
  background:linear-gradient(135deg,rgba(5,8,14,.7),rgba(12,16,28,.75));
  border:1px solid rgba(255,79,216,.55);
  border-radius:14px;
  font-size:clamp(.9rem,1vw,1.05rem);
  font-weight:800;
  overflow:hidden;
  text-align:left;
  outline:none;
  transition:border-color .2s, box-shadow .2s;
  box-shadow:0 0 14px rgba(255,79,216,.12), inset 0 0 16px rgba(53,243,255,.03);
}
.choice::before{
  content:'';
  position:absolute;inset:0;
  background:linear-gradient(110deg,transparent,rgba(255,79,216,.22),rgba(53,243,255,.1),transparent);
  transform:translateX(-120%);
  transition:.42s;
}
.choice:hover{
  border-color:var(--magenta);
  box-shadow:0 0 22px rgba(255,79,216,.4),0 0 40px rgba(53,243,255,.12);
  animation:shake .15s linear 2;
}
.choice:hover::before{transform:translateX(120%)}
.choice:focus-visible{
  box-shadow:0 0 0 3px rgba(53,243,255,.5), 0 0 22px rgba(255,79,216,.25);
  border-color:var(--cyan);
}
.choice small{
  display:block;
  margin-top:4px;
  color:var(--muted);
  font-size:.72rem;
  font-weight:400;
}
@keyframes shake{
  0%{transform:translate(0)}25%{transform:translate(-1px,1px)}
  50%{transform:translate(1px,-1px)}75%{transform:translate(-1px,0)}100%{transform:translate(0)}
}

/* HUD 스탯 바 (하단 전체 가로) */
.hud{
  grid-column:1/-1;
  grid-row:2/3;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  padding:8px 18px 10px;
  border-top:1px solid rgba(53,243,255,.1);
  background:rgba(2,4,12,.35);
}
.stat{
  display:grid;
  grid-template-rows:auto auto;
  gap:5px;
  min-width:0;
}
.stat-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:.75rem;
  color:var(--muted);
  gap:4px;
}
.stat-top span{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:.7rem;
  letter-spacing:.03em;
}
.choice-next{
  border-color:rgba(53,243,255,.35)!important;
  background:linear-gradient(135deg,rgba(3,10,20,.6),rgba(5,12,24,.65))!important;
  color:var(--cyan)!important;
  font-size:.85rem!important;
  font-weight:700!important;
}
.choice-next:hover{
  border-color:rgba(53,243,255,.7)!important;
  box-shadow:0 0 18px rgba(53,243,255,.25)!important;
  animation:none!important;
}
.stat-top strong{
  color:var(--text);
  font-size:.82rem;
  flex-shrink:0;
  transition:color .3s;
}
.stat.danger .stat-top strong{color:var(--warning)}
.bar{
  height:6px;
  border-radius:999px;
  background:rgba(255,255,255,.07);
  overflow:hidden;
}
.fill{
  height:100%;
  border-radius:999px;
  transition:width .36s ease;
  box-shadow:0 0 8px currentColor;
}
.sync {background:var(--cyan);  color:var(--cyan)}
.integ{background:var(--purple);color:var(--purple)}
.noise{background:var(--magenta);color:var(--magenta)}
.aff  {background:var(--cyan-soft);color:var(--cyan-soft)}

/* ━━━━━━━━━━━━━━━━━━━━
   씬별 CSS 폴백 배경
━━━━━━━━━━━━━━━━━━━━ */
.scene-abyss   .bg-fallback{background:radial-gradient(circle at 22% 14%,rgba(53,243,255,.18),transparent 32%),linear-gradient(180deg,#031018 0%,#020409 100%)}
.scene-upper   .bg-fallback{background:radial-gradient(circle at 50% 0%,rgba(214,240,255,.15),transparent 28%),linear-gradient(180deg,#0b1620 0%,#03070b 100%)}
.scene-market  .bg-fallback{background:radial-gradient(circle at 15% 22%,rgba(255,79,216,.18),transparent 28%),radial-gradient(circle at 80% 68%,rgba(138,125,255,.18),transparent 30%),linear-gradient(180deg,#120718 0%,#030206 100%)}
.scene-threat  .bg-fallback{background:radial-gradient(circle at 72% 15%,rgba(255,54,95,.25),transparent 30%),linear-gradient(180deg,#170306 0%,#020205 100%)}
.scene-glitch  .bg-fallback{background:radial-gradient(circle at 35% 20%,rgba(255,79,216,.2),transparent 30%),linear-gradient(180deg,#100414 0%,#020205 100%)}
.scene-judgment .bg-fallback{background:radial-gradient(circle at 50% 30%,rgba(234,252,255,.14),transparent 36%),linear-gradient(180deg,#06101a 0%,#020306 100%)}

/* 타워 실루엣 (장식) */
.tower{
  position:absolute;
  bottom:0;
  width:clamp(50px,5vw,80px);
  border:1px solid rgba(53,243,255,.1);
  background:linear-gradient(180deg,rgba(53,243,255,.1),rgba(2,9,15,.98));
  box-shadow:0 0 18px rgba(53,243,255,.1);
  z-index:3;
  pointer-events:none;
}
.t1{left:4%;  height:38%}.t2{left:13%; height:58%;width:clamp(60px,6vw,94px)}
.t3{left:24%; height:28%}.t4{right:25%;height:48%;width:clamp(65px,6.5vw,104px)}
.t5{right:13%;height:36%}.t6{right:3%; height:62%}

/* ━━━━━━━━━━━━━━━━━━━━
   접근성 / 저모션
━━━━━━━━━━━━━━━━━━━━ */
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}

/* ━━━━━━━━━━━━━━━━━━━━
   반응형
━━━━━━━━━━━━━━━━━━━━ */
@media(max-width:720px){
  :root{--panel-h:50vh;--panel-h-min:240px;--panel-h-max:420px}
  .bottom-panel{
    grid-template-columns:1fr;
    grid-template-rows:1fr auto auto;
  }
  .dialogue{
    grid-column:1/2;grid-row:1/2;
    border-right:none;
    border-bottom:1px solid rgba(53,243,255,.1);
    padding:14px 16px 10px;
  }
  .choices{
    grid-column:1/2;grid-row:2/3;
    width:100%;
    flex-direction:row;
    padding:10px 16px;
    gap:8px;
  }
  .choice{padding:10px 12px;font-size:.82rem}
  .choice small{display:none}
  .hud{
    grid-column:1/2;grid-row:3/4;
    grid-template-columns:repeat(2,1fr);
    padding:8px 14px 12px;
    gap:6px;
  }
  .hud-top{padding:12px 14px}
  .stage-label{font-size:.72rem}
  .game-title{font-size:.95rem}
  .character{width:clamp(140px,35vw,220px)}
}
@media(max-width:420px){
  .choices{flex-direction:column}
  .title-block{display:none}
}
</style>
</head>
<body class="scene-abyss">

<!-- ── 타이틀 화면 ── -->
<div id="titleScreen" style="
  position:fixed;inset:0;z-index:999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#000;cursor:pointer;
">
  <video autoplay muted loop playsinline
    style="position:absolute;inset:0;width:100vw;height:100vh;object-fit:cover;opacity:1;">
    <source src="/portfolio/video/표지.mp4" type="video/mp4">
  </video>
  <div style="position:relative;z-index:2;text-align:center;pointer-events:none;">
    <div style="font-size:clamp(1.8rem,4vw,3.2rem);font-weight:900;letter-spacing:.1em;color:#eafcff;text-shadow:0 0 40px rgba(53,243,255,.8),0 0 80px rgba(53,243,255,.4);margin-bottom:8px">
      DEADLINE ABYSS
    </div>
    <div style="font-size:clamp(.9rem,1.5vw,1.2rem);color:rgba(141,168,184,.8);letter-spacing:.2em;margin-bottom:48px">
      인어의 역습
    </div>
    <div style="font-size:clamp(.8rem,1.2vw,1rem);color:rgba(53,243,255,.7);letter-spacing:.15em;animation:titleBlink 1.4s ease-in-out infinite">
      ▶ 화면을 클릭하여 시작
    </div>
  </div>
  <!-- 하단 그라데이션 -->
  <div style="position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.6) 0%,transparent 50%);pointer-events:none;z-index:1;"></div>
</div>

<style>
@keyframes titleBlink{0%,100%{opacity:1}50%{opacity:.3}}
</style>

<!-- ── 배경 영상 (body 직속, fixed) ── -->
<video id="bgVideo" autoplay muted loop playsinline aria-hidden="true"
  style="position:fixed;top:0;left:0;width:100vw;height:100vh;object-fit:cover;opacity:1;transition:opacity .5s ease;z-index:1;pointer-events:none;"></video>

<!-- ── STAGE (풀스크린) ── -->
<div class="stage" id="stage">
  <!-- 이미지 없을 때 CSS 폴백 -->
  <div class="bg-fallback" id="bgFallback"></div>
  <!-- 분위기 오버레이 레이어들 -->
  <div class="bg-overlay"></div>
  <div class="scanlines"></div>
  <div class="data-grid"></div>
  <div class="water-drift"></div>
  <div class="red-alert"></div>
  <!-- 도시 타워 실루엣 -->
  <div class="tower t1"></div><div class="tower t2"></div><div class="tower t3"></div>
  <div class="tower t4"></div><div class="tower t5"></div><div class="tower t6"></div>
  <!-- 캐릭터 -->
  <div class="character char-mermaid" id="character" aria-hidden="true"></div>
</div>

<!-- ── 좌상단 HUD ── -->
<div class="hud-top">
  <div class="stage-label" id="stageLabel">S1 · 심해 구조</div>
  <div class="title-block">
    <div class="game-title">DEADLINE ABYSS</div>
    <div class="game-sub">인어의 역습</div>
  </div>
</div>

<!-- ── 하단 오버레이 패널 ── -->
<div class="bottom-panel">

  <!-- 대화 -->
  <section class="dialogue" aria-live="polite" aria-label="대화">
    <div class="speaker-row">
      <div class="name" id="speakerName">인어</div>
      <div class="scene-desc" id="sceneDesc">붕괴된 데이터 심해, 푸른 신호 흐름</div>
    </div>
    <div class="text" id="typed" role="status"></div>
  </section>

  <!-- 선택지 -->
  <section class="choices" id="choices" role="group" aria-label="선택지"></section>

  <!-- 스탯 HUD -->
  <footer class="hud" aria-label="캐릭터 스탯">
    <div class="stat" id="statS">
      <div class="stat-top">
        <span title="생존력">SYNC</span>
        <strong id="sText">100</strong>

function clamp(v){return Math.max(0,Math.min(100,v))}
function apply(d){
  state.S=clamp(state.S+(d.S||0));

  state.R=clamp(state.R+(d.R||0));
  state.A=clamp(state.A+(d.A||0));
}

/* ━━━ 판정 로직 (기획서 원문 기준) ━━━
   S8A: INTEG>70 & SYNC>70  → 인간 인정
   S8B: INTEG<30             → 괴물화
   SYNC<=0 || NOISE<=0       → 삭제
   그 외 NOISE 높음          → 완벽한 가짜
*/
function decideEnding(){
  if(state.S<=0||state.R<=0)          return"END_DELETE";
  if(state.I<=30)                     return"END_MONSTER";
  if(state.I>70&&state.S>70)          return"END_HUMAN";
  if(state.R>=60&&state.I<50)         return"END_FAKE";
  if(state.I<45)                      return"END_MONSTER";
  return"END_DELETE";
}
function reset(){
  state.S=100;state.I=70;state.R=20;state.A=0;
  Object.keys(flags).forEach(k=>flags[k]=false);
  current="S1";lastSpeaker="";
}

function typeText(text){
  clearInterval(typingTimer);
  const t=document.getElementById("typed");
  t.innerHTML="";
  let i=0;
  typingTimer=setInterval(()=>{
    t.innerHTML=text.slice(0,i)+'<span class="cursor" aria-hidden="true">▌</span>';
    i++;
    if(i>text.length){clearInterval(typingTimer);t.innerHTML=text;}
  },22);
}

/* 배경 영상 교체 — 즉시 전환 */
function updateBgImage(sceneKey){
  const video=document.getElementById("bgVideo");
  const src=BG_IMAGES[sceneKey]||"";
  if(!src){ video.style.opacity=0; return; }
  if(video.getAttribute("data-src")===src){
    if(video.paused) video.play().catch(()=>{});
    return;
  }
  video.setAttribute("data-src", src);
  video.src=src;
  video.load();
  video.play().catch(()=>{});
}

/* convo 인덱스: 씬 내 대화 순서 진행용 */
function updateCharacter(speaker){
  if(speaker===lastSpeaker)return;
  const el=document.getElementById("character");
  const {svgHTML,themeClass}=buildCharSVG(speaker);
  el.innerHTML=svgHTML;
  el.className="character "+themeClass+" entering";
  el.addEventListener("animationend",()=>el.classList.remove("entering"),{once:true});
  lastSpeaker=speaker;
}

function render(){
  if(current==="ENDING")current=decideEnding();
  const scene=scenes[current];

  /* 씬 테마 */
  document.body.className=scene.theme;

  /* 배경 이미지 */
  updateBgImage(current);

  /* 상단 레이블 + 씬 설명 */
  document.getElementById("stageLabel").textContent=scene.chapter;
  const descEl=document.getElementById("sceneDesc");
  if(scene.bgAlert){
    descEl.innerHTML=`${scene.bg} <span style="color:var(--red);font-weight:900;letter-spacing:.06em;font-size:.72rem">⚠ ${scene.bgAlert}</span>`;
  } else {
    descEl.textContent=scene.bg;
  }

  /* 주요 대사 — 첫 번째 선택지의 화자 or scene.speaker 기준 */
  const speaker=scene.speaker||scene.convo?.[0]?.who||"";
  document.getElementById("speakerName").textContent=speaker;
  typeText(scene.text());
  updateCharacter(speaker);

  /* HUD */
  [["s",state.S],["i",state.I],["r",state.R]].forEach(([id,val])=>{
    document.getElementById(id+"Text").textContent=val;
    document.getElementById(id+"Bar").style.width=val+"%";
    document.getElementById(id+"BarWrap").setAttribute("aria-valuenow",val);
    const statId={s:"statS",i:"statI",r:"statR"}[id];
    document.getElementById(statId).classList.toggle("danger",val<=20);
  });
  /* FLAGS 패널 */
  const fd=document.getElementById("flagDisplay");
  if(fd){
    const active=Object.entries(flags).filter(([,v])=>v).map(([k])=>k);
    fd.innerHTML=active.length
      ? active.map(k=>`<span style="background:rgba(53,243,255,.15);border:1px solid rgba(53,243,255,.3);border-radius:4px;padding:1px 5px;color:var(--cyan)">${k}</span>`).join("")
      : `<span style="color:rgba(141,168,184,.4)">없음</span>`;
  }

  /* 선택지 — 바로 표시 */
  const box=document.getElementById("choices");
  box.innerHTML="";
  scene.choices.forEach(ch=>{
    const btn=document.createElement("button");
    btn.className="choice";
    btn.type="button";
    btn.setAttribute("aria-label",`${ch.label} — ${ch.hint}`);
    btn.innerHTML=`${ch.label}<small aria-hidden="true">${ch.hint}</small>`;
    btn.onclick=()=>{
      if(ch.next==="RESET"){ reset(); render(); return; }
      apply(ch.delta);
      if(ch.onSelect) ch.onSelect();
      current=ch.next;
      render();
    };
    box.appendChild(btn);
  });
}

/* ── 타이틀 화면 클릭 → 게임 시작 ── */
document.getElementById("titleScreen").addEventListener("click", ()=>{
  const title = document.getElementById("titleScreen");
  title.style.transition = "opacity .4s ease";
  title.style.opacity = "0";
  setTimeout(()=>{ title.style.display="none"; }, 400);
});

render();
</script>
